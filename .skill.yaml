# .skill.yaml — Skill Distribution Manifest
# Format: Best practice for cross-platform skill distribution (April 2026)
# Not yet standardized, but future-proofs for emerging package managers.
#
# Status: This manifest is supplementary. The canonical entry point is
# skills/surface/SKILL.md (Claude Code) and AGENTS.md (Codex, generic agents).

name: surface
version: 2.3.0
license: MIT

description: |
  Make software legible to agents. Guide, audit or scaffold the surfaces agents use: discovery, context files, APIs, CLIs, tools, MCP servers, authentication, errors, retrieval and the tests that prove them.

entry-point: ./skills/surface/SKILL.md

author:
  name: Daniel Howells

homepage: https://github.com/howells/agentsurface
repository:
  type: git
  url: https://github.com/howells/agentsurface.git

keywords:
  - agentic
  - mcp
  - api-design
  - cli-design
  - agent-dx
  - audit
  - scorecard
  - scaffolding
  - llms-txt
  - agents-md
  - agent-discovery
  - retrievability
  - tools
  - webmcp

compatibility:
  - claude-code >= 1.0.0
  - claude-agent-sdk >= 1.0.0
  - openai-codex >= 0.1.0
  - agents-md >= 1.0.0

dependencies: []

specialist-agents:
  - context-writer
  - discovery-writer
  - error-designer
  - api-optimizer
  - cli-enhancer
  - auth-upgrader
  - mcp-builder
  - test-writer
  - retrievability-engineer
  - tool-design-writer

# Distribution URLs (for future registry lookup)
distribution:
  github: "https://github.com/howells/agentsurface/releases"
  claude-code-plugin: "surface"
