# Arazzo 1.1.0 Workflow - Multi-step agent orchestration
#
# Canonical spec: https://spec.openapis.org/arazzo/v1.1.0.html
# Aligned with: OpenAPI 3.2.x
# Use case: Compose multi-step agent workflows (create → activate → verify)
#
# When to use this:
# - Multi-step operations that must occur in sequence
# - Workflows requiring data flow between steps
# - Agent-discoverable workflows (agents understand successCriteria)
# - Retry logic and conditional branching
#
# Structure notes (Arazzo 1.1.0):
# - `workflows` is an array of Workflow Objects, each with a unique `workflowId`.
# - `sourceDescriptions` entries need `name`, `url` and `type` (openapi or arazzo).
# - Workflow `inputs` is a JSON Schema; read values with `$inputs.<name>`.
# - Step `parameters` is an array of `{ name, in, value }` objects.
# - Step and workflow `outputs` are maps from a name to a runtime expression. Declare a step
#   output before another step or the workflow references it.
# - Retry, goto and end behavior is declared with Success/Failure Action Objects
#   (`type: retry | goto | end`) in `onSuccess` / `onFailure`.
#
# Customization checklist:
# ✓ Update sourceDescriptions[] with your API spec URLs
# ✓ Update workflow steps with actual operationIds from spec (every operationId here exists in
#   openapi-skeleton.yaml; keep it that way when you swap in your own API)
# ✓ Set successCriteria based on real response conditions
# ✓ Configure retry actions for flaky operations
# ✓ Add onFailure actions (rollback, notify, etc.)
# ✓ Declare workflow outputs
# ✓ Test against real API

arazzo: 1.1.0
info:
  title: Agent Onboarding Workflow
  version: 1.0.0
  description: |
    Multi-step workflow to create a new agent, activate it and verify the result.

    Demonstrates:
    - Sequential step orchestration
    - Data flow between steps ($steps.X.outputs.Y)
    - Success criteria validation
    - Failure actions with rollback
    - Structured workflow outputs

    Spec: https://spec.openapis.org/arazzo/v1.1.0.html

sourceDescriptions:
  # The description this workflow's operationIds come from (openapi-skeleton.yaml)
  - name: agentApi
    url: https://api.example.com/v1/openapi.yaml
    type: openapi

workflows:
  - workflowId: agentOnboarding
    summary: Create and activate a new agent
    description: |
      End-to-end workflow: create agent (starts as draft) → set it active → read it back.

      Demonstrates agent-ready workflow composition with explicit success/failure handling.

    inputs:
      type: object
      required: [agent_name, agent_model, idempotency_key]
      properties:
        agent_name:
          type: string
          description: Name of the new agent
        agent_model:
          type: string
          description: Model to use (claude-opus-5-5 | claude-sonnet-5-5 | claude-haiku-5-5)
        idempotency_key:
          type: string
          description: |
            One random value per run of this workflow (a UUID). Each write sends it as
            Idempotency-Key with a per-step suffix, because a key identifies one request: re-running
            the workflow after a network failure then cannot create a second agent.

    steps:
      # Step 1: Create the agent
      - stepId: create_agent
        description: Create agent with specified configuration
        operationId: $sourceDescriptions.agentApi.create_agent
        parameters:
          - name: Idempotency-Key
            in: header
            value: "{$inputs.idempotency_key}-create"
        requestBody:
          contentType: application/json
          payload:
            name: $inputs.agent_name
            description: "Onboarded agent (created via workflow)"
            model: $inputs.agent_model
            tools: []
            max_steps: 20
        successCriteria:
          # HTTP 201 indicates successful creation
          - condition: $statusCode == 201
          - condition: $response.body#/id != null
        outputs:
          id: $response.body#/id
          name: $response.body#/name
          model: $response.body#/model
          created_at: $response.body#/created_at

      # Step 2: Activate the agent (new agents start as draft)
      - stepId: activate_agent
        description: Move the new agent from draft to active
        operationId: $sourceDescriptions.agentApi.update_agent
        parameters:
          - name: agent_id
            in: path
            value: $steps.create_agent.outputs.id
          - name: Idempotency-Key
            in: header
            value: "{$inputs.idempotency_key}-activate"
        requestBody:
          contentType: application/json
          payload:
            status: active
        successCriteria:
          - condition: $statusCode == 200
        onFailure:
          # Not found right after creation is usually a timing issue: retry with a delay
          - name: retryWhileNotVisible
            type: retry
            retryAfter: 2
            retryLimit: 3
            criteria:
              - condition: $statusCode == 404
          # Anything else: roll back the creation, then stop the workflow
          - name: rollbackAndStop
            type: goto
            stepId: rollback_agent

      # Step 3: Read the agent back and confirm it is active
      - stepId: verify_agent
        description: Confirm the agent can be retrieved and is in active state
        operationId: $sourceDescriptions.agentApi.get_agent_by_id
        parameters:
          - name: agent_id
            in: path
            value: $steps.create_agent.outputs.id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'active'
        outputs:
          status: $response.body#/status
        onSuccess:
          - name: done
            type: end
        onFailure:
          - name: rollbackAndStop
            type: goto
            stepId: rollback_agent

      # Rollback target. Only reached through the goto actions above.
      - stepId: rollback_agent
        description: Activation or verification failed - delete the created agent
        operationId: $sourceDescriptions.agentApi.delete_agent
        parameters:
          - name: agent_id
            in: path
            value: $steps.create_agent.outputs.id
          - name: Idempotency-Key
            in: header
            value: "{$inputs.idempotency_key}-rollback"
        successCriteria:
          - condition: $statusCode == 204
        onSuccess:
          - name: stopAfterRollback
            type: end

    outputs:
      agent_id: $steps.create_agent.outputs.id
      agent_name: $steps.create_agent.outputs.name
      agent_model: $steps.create_agent.outputs.model
      created_at: $steps.create_agent.outputs.created_at
      agent_status: $steps.verify_agent.outputs.status

  # Second workflow: run an agent once and read the execution back
  - workflowId: agentSmokeRun
    summary: Verify an agent's configuration, start one execution and read its status
    description: |
      Steps run in the order listed; Arazzo does not define parallel steps. Independent steps can
      be split into separate workflows and started concurrently by the orchestrator.

      run_agent is asynchronous: this workflow reads the execution once. Poll get_execution from
      the orchestrator until the status is completed, failed or cancelled.

    inputs:
      type: object
      required: [agent_id, idempotency_key]
      properties:
        agent_id:
          type: string
          description: Agent ID to run
        idempotency_key:
          type: string
          description: One random value per run of this workflow (a UUID), sent as Idempotency-Key with a per-step suffix

    steps:
      # Step 1: Get agent metadata
      - stepId: get_agent_config
        operationId: $sourceDescriptions.agentApi.get_agent_by_id
        parameters:
          - name: agent_id
            in: path
            value: $inputs.agent_id
        successCriteria:
          - condition: $statusCode == 200
          - condition: $response.body#/status == 'active'
        outputs:
          name: $response.body#/name
          status: $response.body#/status

      # Step 2: Start an execution
      - stepId: start_execution
        operationId: $sourceDescriptions.agentApi.run_agent
        parameters:
          - name: agent_id
            in: path
            value: $inputs.agent_id
          - name: Idempotency-Key
            in: header
            value: "{$inputs.idempotency_key}-run"
        requestBody:
          contentType: application/json
          payload:
            input: {}
        successCriteria:
          - condition: $statusCode == 202
        outputs:
          execution_id: $response.body#/execution_id

      # Step 3: Read the execution's status
      - stepId: get_execution_status
        operationId: $sourceDescriptions.agentApi.get_execution
        parameters:
          - name: execution_id
            in: path
            value: $steps.start_execution.outputs.execution_id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          status: $response.body#/status

    outputs:
      agent_name: $steps.get_agent_config.outputs.name
      agent_status: $steps.get_agent_config.outputs.status
      execution_id: $steps.start_execution.outputs.execution_id
      execution_status: $steps.get_execution_status.outputs.status
